<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#181c27;--bd:#1e2535;--bd2:#2a3347;--ac:#818cf8;--ac2:#6366f1;--tx:#e2e8f0;--mut:#64748b;--mut2:#94a3b8;--ok:#34d399;--warn:#fb923c;--err:#f87171;--pur:#c084fc;--hov:rgba(129,140,248,.06)}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.hide{display:none!important}
.muted{color:var(--mut)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex:none}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.gate-card h1{font-size:20px;font-weight:700}
.gate-card .logo-m{margin:0 auto 4px}
.gate-err{min-height:18px;color:var(--err);font-size:13px}
.logo-m{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#818cf8,#6366f1);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.logo-m.big{width:48px;height:48px;border-radius:13px;font-size:16px}
.hdr{position:sticky;top:0;z-index:40;background:rgba(15,17,23,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hdr-in{max-width:1560px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 14px;border-radius:9px;color:var(--mut2);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.nav a.on{background:rgba(129,140,248,.14);color:#a5b4fc}
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}
.conn{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--bd);font-size:12px;color:var(--mut2);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.conn.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.conn.err i{background:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.18)}
.conn.chk i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.subnav{border-top:1px solid var(--bd)}
.subnav-in{max-width:1560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.subnav-in a{padding:10px 14px;color:var(--mut2);font-weight:500;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.subnav-in a:hover{color:var(--tx)}
.subnav-in a.on{color:#a5b4fc;border-color:var(--ac)}
.main{max-width:1560px;margin:0 auto;padding:24px 20px 60px}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pg-t{font-size:22px;font-weight:700;letter-spacing:-.02em}
.pg-s{color:var(--mut2);margin-top:2px;font-size:13px}
.pg-act{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s;background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--ac2);color:#fff}
.btn-p:hover:not(:disabled){background:#7578f5}
.btn-g{border-color:var(--bd2);color:var(--tx);background:transparent}
.btn-g:hover:not(:disabled){background:rgba(255,255,255,.05)}
.btn-d{background:rgba(239,68,68,.12);color:var(--err);border-color:rgba(239,68,68,.25)}
.btn-d:hover:not(:disabled){background:rgba(239,68,68,.2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn.busy::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut2);transition:background .15s,color .15s}
.ib:hover{background:rgba(255,255,255,.07);color:var(--tx)}
.ib.danger:hover{background:rgba(239,68,68,.14);color:var(--err)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.kpi-l{font-size:12px;color:var(--mut2);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi-v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.ok .kpi-v{color:var(--ok)}
.kpi.err .kpi-v{color:var(--err)}
.kpi.ac .kpi-v{color:#a5b4fc}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.srch{position:relative;flex:1 1 260px;max-width:420px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.srch .inp{padding-left:34px}
.cnt-t{margin-left:auto;color:var(--mut);font-size:12px}
.inp{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;min-height:38px}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(129,140,248,.15)}
.inp::placeholder{color:var(--mut)}
.inp.bad{border-color:var(--err)}
select.inp{appearance:auto}
select.sel{width:auto;min-width:150px;max-width:240px}
textarea.inp{resize:vertical;min-height:76px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
input[type=checkbox]{accent-color:var(--ac2);width:16px;height:16px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;padding:11px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);background:rgba(255,255,255,.02);border-bottom:1px solid var(--bd);white-space:nowrap;user-select:none}
.tbl th.srt{cursor:pointer}
.tbl th.srt:hover{color:var(--tx)}
.tbl th.on{color:#a5b4fc}
.tbl th .ar{font-style:normal;font-size:9px;margin-left:5px}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clk{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hov)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.neg{color:var(--err);font-weight:600}
.tbl td.b{font-weight:600}
.tbl .tr{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.tbl td.acts{text-align:right;width:1%}
.tbl td.acts>div{display:flex;gap:2px;justify-content:flex-end}
.loadable{transition:opacity .15s}
.loadable.loading{opacity:.45;pointer-events:none}
.empty{padding:48px 20px;text-align:center;color:var(--mut)}
.empty.err{color:var(--err)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--bd);flex-wrap:wrap;font-size:12px;color:var(--mut2)}
.pg-n{display:flex;gap:4px;align-items:center}
.pg-b{min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--mut2);font-size:12px;font-weight:500}
.pg-b:hover:not(:disabled){background:rgba(255,255,255,.05);color:var(--tx)}
.pg-b.on{background:rgba(129,140,248,.16);border-color:rgba(129,140,248,.4);color:#a5b4fc}
.pg-b:disabled{opacity:.35;cursor:default}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap}
.b-ok{background:rgba(16,185,129,.15);color:#34d399}
.b-warn{background:rgba(249,115,22,.15);color:#fb923c}
.b-err{background:rgba(239,68,68,.15);color:#f87171}
.b-pur{background:rgba(139,92,246,.15);color:#c084fc}
.b-mut{background:rgba(255,255,255,.06);color:#64748b}
.b-def{background:rgba(129,140,248,.14);color:#a5b4fc}
.b-hsp{background:rgba(244,114,182,.14);color:#f472b6}
.b-odv{background:rgba(56,189,248,.14);color:#38bdf8}
.sw{position:relative;display:inline-block;width:36px;height:20px;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--bd2);transition:background .15s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--ac2)}
.sw input:checked+span::after{transform:translateX(16px)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full,.f-sec{grid-column:1/-1}
.lbl{font-size:12px;font-weight:500;color:var(--mut2)}
.req{color:var(--err)}
.f-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a5b4fc;padding-top:8px;border-bottom:1px solid var(--bd);padding-bottom:6px}
.f-sec:first-child{padding-top:0}
.ro{min-height:38px;display:flex;align-items:center;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.025);border:1px dashed var(--bd);font-size:13px;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:9px;min-height:38px;font-size:13px;cursor:pointer}
.tags{display:flex;gap:14px;flex-wrap:wrap;min-height:38px;align-items:center}
.hint{font-size:12px;color:var(--mut);margin-top:14px}
.ov{position:fixed;inset:0;z-index:80;background:rgba(5,7,12,.7);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:760px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;animation:rise .18s}
.modal.sm{max-width:420px;margin-top:12vh}
.modal.wide{max-width:960px}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--bd)}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:20px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.modal-f .mr-auto{margin-right:auto}
.cat-pick{grid-column:1/-1;padding:12px;border-radius:10px;background:rgba(129,140,248,.07);border:1px solid rgba(129,140,248,.2)}
.pn-ov{position:fixed;inset:0;background:rgba(5,7,12,.6);z-index:60;opacity:0;transition:opacity .22s}
.pn{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100vw);background:var(--bg);border-left:1px solid var(--bd);z-index:61;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
.pn-root.open .pn-ov{opacity:1}
.pn-root.open .pn{transform:none}
.pn-head{padding:18px 24px 14px;border-bottom:1px solid var(--bd);background:var(--card)}
.pn-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.pn-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.pn-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--mut2);font-size:13px}
.pn-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.pn-kpis .kpi{padding:10px 14px;background:var(--bg)}
.pn-kpis .kpi-v{font-size:17px}
.pn-tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;background:var(--card)}
.pn-tabs button{padding:12px 16px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut2);font-weight:500;font-size:13px;white-space:nowrap}
.pn-tabs button:hover:not(:disabled){color:var(--tx)}
.pn-tabs button.on{color:#a5b4fc;border-color:var(--ac)}
.pn-tabs button:disabled{opacity:.35;cursor:not-allowed}
.pn-body{flex:1;overflow-y:auto}
.pad{padding:20px 24px}
.pn-foot{position:sticky;bottom:0;padding:14px 24px;background:rgba(15,17,23,.95);border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px}
.pn-load{display:grid;place-items:center;padding:80px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--bd2);border-top-color:var(--ac);animation:spin .8s linear infinite}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stab{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--mut2);font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.stab:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.stab.on{background:rgba(129,140,248,.15);border-color:rgba(129,140,248,.4);color:#a5b4fc}
.stab i{font-style:normal;min-width:18px;height:18px;border-radius:99px;background:rgba(255,255,255,.08);font-size:11px;display:grid;place-items:center;padding:0 5px}
.stab i:empty{display:none}
.ln-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sums{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut2);justify-content:flex-end}
.sums b{color:var(--tx);font-variant-numeric:tabular-nums;margin-left:4px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s;max-width:420px}
.toast.success{background:#059669}
.toast.error{background:#dc2626}
.toast.info{background:#4f46e5}
.setg{display:flex;flex-direction:column;gap:14px}
details.adv summary{cursor:pointer;color:var(--mut2);font-size:12px;margin-bottom:8px}
@media(max-width:760px){
.hdr-in{padding:0 12px;gap:8px}
.logo-t{display:none}
.conn .ct{display:none}
.conn{padding:6px}
.main{padding:16px 12px 48px}
.pg-t{font-size:19px}
.pad{padding:16px 14px}
.pn-head{padding:14px}
.modal-b,.modal-h,.modal-f{padding-left:16px;padding-right:16px}
.kpi-v{font-size:20px}
.srch{max-width:none}
select.sel{flex:1 1 140px;max-width:none}
}
</style>
</head>
<body>
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card" autocomplete="off">
    <div class="logo-m big">AG</div>
    <h1>Painel de Gestão</h1>
    <p class="muted">Introduza a palavra-passe para continuar.</p>
    <input id="gate-pw" type="password" class="inp" placeholder="Palavra-passe" autocomplete="current-password" autofocus>
    <div id="gate-err" class="gate-err"></div>
    <button class="btn btn-p" type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="hide">
  <header class="hdr">
    <div class="hdr-in">
      <a class="logo" href="#hsp"><span class="logo-m">AG</span><span class="logo-t">Painel de Gestão</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="hdr-r">
        <div id="conn" class="conn off" data-act="settings" style="cursor:pointer"><i></i><span class="ct">Não configurado</span></div>
        <button class="ib" data-act="settings" data-ic="gear" title="Definições"></button>
        <button class="ib" data-act="logout" data-ic="logout" title="Terminar sessão"></button>
      </div>
    </div>
    <div class="subnav hide" id="subnav"></div>
  </header>
  <main id="view" class="main"></main>
</div>

<div id="panel-root"></div>
<div id="modals"></div>
<div id="toasts"></div>

<script>
'use strict';

const PASS_HASH='46fee684fd314a7e74b800fc6f5e6f6c029b6daa08963514abf5e5c898947e4a';
const PAGE=25;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>v==null?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const ssDel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
const readJSON=s=>{try{const o=JSON.parse(s);return o&&typeof o==='object'?o:{}}catch(e){return {}}};
const num=x=>{const n=Number(x);return isFinite(n)?n:0};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const EUR=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const NUM=new Intl.NumberFormat('de-DE',{maximumFractionDigits:2});
const fmtEur=v=>v==null||v===''||!isFinite(Number(v))?'—':EUR.format(Number(v));
const fmtNum=v=>v==null||v===''||!isFinite(Number(v))?'—':NUM.format(Number(v));
function fmtDate(v){
  if(!v)return '—';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  return m?m[3]+'/'+m[2]+'/'+m[1]:String(v);
}
function boolish(v){
  if(v===true||v===false)return v;
  if(v==null||v==='')return null;
  const s=String(v).trim().toLowerCase();
  if(['true','t','sim','s','yes','1'].includes(s))return true;
  if(['false','f','nao','não','n','no','0'].includes(s))return false;
  return null;
}

const I={
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>',

function sha256Js(s){
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  const bytes=Array.from(new TextEncoder().encode(s));
  const bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  const hi=Math.floor(bitLen/4294967296),lo=bitLen>>>0;
  for(let i=3;i>=0;i--)bytes.push((hi>>>(i*8))&255);
  for(let i=3;i>=0;i--)bytes.push((lo>>>(i*8))&255);
  const K=[],H=[];
  let cnt=0;
  for(let c=2;cnt<64;c++){
    let prime=true;
    for(let d=2;d*d<=c;d++)if(c%d===0){prime=false;break}
    if(prime){
      if(cnt<8)H[cnt]=(Math.pow(c,.5)%1)*4294967296|0;
      K[cnt++]=(Math.pow(c,1/3)%1)*4294967296|0;
    }
  }
  for(let o=0;o<bytes.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++)w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){
      const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha256(s){
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256Js(s);
}

function initClient(){

function setConn(state,msg){
  const el=$('#conn');
  if(!el)return;
  el.className='conn '+state;
  $('.ct',el).textContent=CONN_TXT[state];
  el.title=msg||CONN_TXT[state];
}
async function checkConn(){
  if(!sb){setConn('off');return {ok:false,msg:'Não configurado'}}
  setConn('chk');
  try{
    const {error}=await sb.from(tb('grupos')).select('id',{count:'exact',head:true});
    if(error)throw error;
    setConn('ok');
    return {ok:true};
  }catch(e){
    const msg=errMsg(e);
    setConn('err',msg);
    return {ok:false,msg};
  }
}
function errMsg(e){
  if(!e)return 'Erro desconhecido';
  if(typeof e==='string')return e;
  const code=e.code||'';
  const status=e.status||e.statusCode||0;
  const m=e.message||e.details||e.error_description||e.description||e.hint||'';
  const txt=typeof m==='string'&&m?m:(typeof e==='object'?JSON.stringify(e):String(e));
  if(status===401||code==='401'||/unauthorized|invalid.*key|invalid.*jwt/i.test(txt))return 'Chave API inválida ou expirada (401). Verifique a chave anónima em Supabase → Settings → API.';
  if(status===403)return 'Acesso negado (403). Verifique as permissões RLS.';
  if(code==='23505')return 'Já existe um registo com estes dados (valor duplicado).';
  if(code==='23503')return 'Operação não permitida: existem registos associados.';
  if(code==='23502')return 'Existem campos obrigatórios por preencher.';
  if(code==='42501')return 'Sem permissões para esta operação.';
  if(code==='42P01')return 'Tabela não encontrada. Verifique se o schema foi criado.';
  if(code==='PGRST301')return 'Tabela ou vista não encontrada.';
  if(/Failed to fetch|NetworkError/i.test(String(txt)))return 'Falha de rede. Verifique a ligação e o URL do Supabase.';
  return txt||'Erro desconhecido';
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  const tab=TABS.some(t=>t[0]===h[0])?h[0]:(ssGet('ag_tab')||'hsp');
  const subs=SUBTABS[tab];
  APP.tab=tab;
  if(subs){
    APP.sub=subs.some(s=>s[0]===h[1])?h[1]:(APP.subs[tab]||subs[0][0]);
    APP.subs[tab]=APP.sub;
  }else APP.sub=null;
  ssSet('ag_tab',tab);
  render();
}
function render(){
  closePanel(true);
  $('#nav').innerHTML=TABS.map(t=>'<a href="#'+t[0]+'" class="'+(APP.tab===t[0]?'on':'')+'">'+t[1]+'</a>').join('');
  const subs=SUBTABS[APP.tab];

  if(subs){
    sn.classList.remove('hide');
    sn.innerHTML='<div class="subnav-in">'+subs.map(s=>'<a href="#'+APP.tab+'/'+s[0]+'" class="'+(APP.sub===s[0]?'on':'')+'">'+s[1]+'</a>').join('')+'</div>';

const CACHE={sg:{},parc:null,cat:{}};

async function fetchAll(mk,max){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await mk().range(from,from+999);
    if(error)throw error;
    out.push(...data);
    if(data.length<1000||out.length>=(max||20000))break;
  }
  return out;
}
async function loadSg(table,col){
  const key=table+'.'+col;
  if(CACHE.sg[key])return CACHE.sg[key];
  try{
    const {data,error}=await sb.from(table).select(col).not(col,'is',null).limit(1000);
    if(error)throw error;
    CACHE.sg[key]=[...new Set(data.map(r=>String(r[col]).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  }catch(e){CACHE.sg[key]=[]}
  return CACHE.sg[key];
}
function dropSg(table){
  Object.keys(CACHE.sg).forEach(k=>{if(k.startsWith(table+'.'))delete CACHE.sg[k]});
}
async function loadParc(){
  if(CACHE.parc)return CACHE.parc;
  try{
    CACHE.parc=await fetchAll(()=>sb.from(tb('parceiros')).select('id,nome_empresa,cidades,marca,ativo').order('nome_empresa'));
  }catch(e){CACHE.parc=[]}
  return CACHE.parc;
}
async function loadCat(prodKey){
  if(CACHE.cat[prodKey])return CACHE.cat[prodKey];
  try{
    CACHE.cat[prodKey]=await fetchAll(()=>sb.from(ENT[prodKey].table).select('*').eq('ativo',true).order(ENT[prodKey].sort[0]),3000);
  }catch(e){CACHE.cat[prodKey]=[]}
  return CACHE.cat[prodKey];
}
async function dbSave(ent,row,payload){
  const t=sb.from(ent.table);
  const r=row?await t.update(payload).eq(ent.pk,row[ent.pk]).select():await t.insert(payload).select();
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw new Error('A operação não teve efeito. Verifique as permissões (RLS) da tabela.');
  afterWrite(ent);
  return r.data[0];
}
async function dbDel(ent,id){
  const r=await sb.from(ent.table).delete().eq(ent.pk,id).select();
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw new Error('Não foi possível eliminar. Verifique as permissões (RLS) da tabela.');
  afterWrite(ent);
}
function afterWrite(ent){
  dropSg(ent.table);
  if(ent.table===ENT.parceiros.table)CACHE.parc=null;
  CACHE.cat={};
}

async function loadList(c){
  const tok=c.tok=(c.tok||0)+1;
  const key=c.key;
  const box=document.getElementById('tbl-'+key);
  if(!box)return;
  if(!sb){box.innerHTML=noConnHTML();return}
  box.classList.add('loading');
  let q=sb.from(c.ent.table).select('*',{count:'exact'});
  q=applyAll(q,c);
  q=q.order(c.st.sortK,{ascending:c.st.sortDir==='asc',nullsFirst:false});
  if(c.st.sortK!==c.ent.pk)q=q.order(c.ent.pk,{ascending:false});
  const from=(c.st.page-1)*PAGE;
  let res;
  try{res=await q.range(from,from+PAGE-1)}catch(e){res={error:e}}
  if(tok!==c.tok)return;
  const b=document.getElementById('tbl-'+key);
  if(!b)return;
  b.classList.remove('loading');
  if(res.error){
    b.innerHTML=errBox(res.error);
    return;
  }
  const count=res.count||0;
  if(!res.data.length&&c.st.page>1&&count>0){
    c.st.page=Math.max(1,Math.ceil(count/PAGE));
    return loadList(c);
  }
  c.st.rows=res.data;
  c.st.count=count;
  const cnt=document.getElementById('cnt-'+key);
  if(cnt)cnt.textContent=count+' registo'+(count===1?'':'s');
  if(!res.data.length){
    const filtered=cleanSearch(c.st.q)||Object.values(c.st.f).some(v=>v!=='');
    b.innerHTML='<div class="empty">'+(filtered?'Nenhum resultado para os filtros aplicados.':'Sem dados para mostrar.')+'</div>';
  }else{
    const actions=c.actions||[['row-edit','edit','Editar'],['row-del','trash','Eliminar','danger']];
    b.innerHTML=tableHTML(c.ent.cols,res.data,{key,pk:c.ent.pk,sortable:true,sortK:c.st.sortK,sortDir:c.st.sortDir,rowAct:'list-open',actions})+pagerHTML(c);
  }
  if(c.kpis)loadKpis(c,tok);
}
async function loadKpis(c,tok){
  const defs=c.kpis;
  const cols=[...new Set(defs.filter(d=>d.col).map(d=>d.col))];
  const sums={};
  cols.forEach(x=>{sums[x]=0});
  if(cols.length){
    try{
      for(let from=0;;from+=1000){
        let q=sb.from(c.ent.table).select(cols.join(','));
        q=applyAll(q,c).order(c.ent.pk).range(from,from+999);
        const {data,error}=await q;
        if(error)throw error;
        data.forEach(r=>cols.forEach(x=>{sums[x]+=num(r[x])}));
        if(data.length<1000)break;
        if(tok!==c.tok)return;
      }
    }catch(e){return}
  }
  if(tok!==c.tok)return;
  const el=document.getElementById('kpi-'+c.key);
  if(el)el.innerHTML=kpiHTML(defs,defs.map(d=>d.col?sums[d.col]:c.st.count));
}

function normV(t,v){
  if(t==='check')return !!v;
  if(v===undefined||v===null||v==='')return null;
  switch(t){
    case 'num':case 'money':case 'int':return Number(v);
    case 'bool':return boolish(v);
    case 'date':return String(v).slice(0,10);
    case 'time':return String(v).slice(0,5);
    case 'tags':return Array.isArray(v)&&v.length?JSON.stringify([...v].sort()):null;
    default:return String(v);
  }
}

function formHTML(ent,vals,o){
  return ent.fields.map(f=>fieldHTML(f,vals,o)).join('');

function collect(form,fields){
  const out={};
  fields.filter(isInput).forEach(f=>{
    if(f.t==='tags'){
      out[f.k]=$$('[data-k="'+f.k+'"]:checked',form).map(x=>x.value);
      return;
    }
    const el=$('[data-k="'+f.k+'"]',form);
    if(!el)return;
    if(f.t==='check'){out[f.k]=el.checked;return}
    let v=el.value;
    if(f.t==='bool'){out[f.k]=v===''?null:v==='true';return}
    if(f.t==='num'||f.t==='money'){out[f.k]=v===''?null:Number(v);return}
    if(f.t==='int'){out[f.k]=v===''?null:parseInt(v,10);return}
    v=v.trim();
    out[f.k]=v===''?null:v;
  });
  return out;
}
function calcValues(ent,form){
  if(!ent.calc)return {};
  const vals=collect(form,ent.fields);
  const out={};
  Object.keys(ent.calc).forEach(k=>{out[k]=ent.calc[k](Object.assign({},vals,out))});
  return out;
}
function updateCalc(ent,form){
  if(!ent.calc)return;
  const out=calcValues(ent,form);
  Object.keys(out).forEach(k=>{
    const el=$('[data-calc="'+k+'"]',form);
    if(el)el.textContent=fmtEur(out[k]);
  });
}
function wireForm(ent,form,o){

    pick.addEventListener('change',()=>{
      const p=(CACHE.cat[ent.catalog.prod]||[]).find(x=>String(x[ENT[ent.catalog.prod].pk])===pick.value);
      if(!p)return;
      Object.keys(ent.catalog.map).forEach(fk=>{
        const el=$('[data-k="'+fk+'"]',form);
        const val=p[ent.catalog.map[fk]];
        if(el&&val!=null)el.value=val;
      });
      updateCalc(ent,form);
    });
  }
}

async function prepForm(ent){
  const jobs=[];
  ent.fields.forEach(f=>{if(f.sg)jobs.push(loadSg(f.sg[0],f.sg[1]))});
  if(ent.fields.some(f=>f.t==='parceiro'))jobs.push(loadParc());
  if(ent.catalog)jobs.push(loadCat(ent.catalog.prod));
  await Promise.all(jobs);
}
async function persist(ent,row,form,fixed){
  const data=collect(form,ent.fields);
  const miss=ent.fields.filter(f=>f.req&&(data[f.k]==null||data[f.k]===''));
  $$('.bad',form).forEach(x=>x.classList.remove('bad'));
  if(miss.length){
    miss.forEach(f=>{const el=$('[data-k="'+f.k+'"]',form);if(el)el.classList.add('bad')});
    const e=new Error('Preencha os campos obrigatórios: '+miss.map(f=>f.l).join(', ')+'.');
    e.user=true;
    throw e;
  }
  const payload={};
  if(row){
    ent.fields.filter(isInput).forEach(f=>{if(!same(f.t,row[f.k],data[f.k]))payload[f.k]=data[f.k]});
    if(fixed){Object.keys(fixed).forEach(k=>{if(fixed[k]!=null&&!same('text',row[k],fixed[k]))payload[k]=fixed[k]})}
  }else{
    ent.fields.filter(isInput).forEach(f=>{
      const v=data[f.k];
      if(v==null||v===''||(Array.isArray(v)&&!v.length))return;
      payload[f.k]=v;
    });
    Object.assign(payload,fixed||{});
  }
  if('parceiro_id' in payload){
    const p=(CACHE.parc||[]).find(x=>String(x.id)===String(payload.parceiro_id));
    payload.parceiro_nome=p?p.nome_empresa:null;
  }
  if(ent.calc&&lsGet('ag_send_calc')==='1'){
    const out=calcValues(ent,form);
    Object.keys(out).forEach(k=>{if(isFinite(out[k])&&(!row||!same('money',row[k],out[k])))payload[k]=Math.round(out[k]*100)/100});
  }
  if(row&&!Object.keys(payload).length)return null;
  return dbSave(ent,row,payload);
}
async function openForm(ent,row,o){
  o=o||{};
  await prepForm(ent);
  const isNew=!row;
  const vals=isNew?Object.assign(defaultsOf(ent),o.defaults||{}):Object.assign({},row);
  const m=openModal(
    '<div class="modal-h"><h3>'+esc((isNew?'Adicionar — ':'Editar — ')+ent.label)+'</h3><button class="ib" data-close>'+ico('x')+'</button></div>'+
    '<div class="modal-b"><form class="fgrid" autocomplete="off">'+catalogHTML(ent)+formHTML(ent,vals,o)+'</form>'+(ent.calc?'<p class="hint">Os valores calculados são indicativos; a base de dados pode recalculá-los ao guardar.</p>':'')+'</div>'+
    '<div class="modal-f">'+(!isNew&&o.canDelete!==false?'<button class="btn btn-d mr-auto" data-del>Eliminar</button>':'')+'<button class="btn btn-g" data-close>Cancelar</button><button class="btn btn-p" data-save>Guardar</button></div>',
    {cls:ent.wide?'wide':'',sticky:true}
  );
  const form=$('form',m.box);
  wireForm(ent,form,o);
  form.addEventListener('submit',e=>e.preventDefault());
  const first=$('input:not([type=checkbox]),select',form);
  if(first&&isNew)first.focus();
  const saveBtn=$('[data-save]',m.box);
  saveBtn.addEventListener('click',async()=>{
    setBusy(saveBtn,true);
    try{
      const saved=await persist(ent,isNew?null:row,form,o.fixed);
      if(saved===null)toast('Sem alterações para guardar.','info');
      else toast(isNew?'Registo criado com sucesso.':'Alterações guardadas.');
      m.close();
      if(o.onSaved)o.onSaved(saved);
    }catch(e){
      toast(errMsg(e),'error');
      setBusy(saveBtn,false);
    }
  });
  const delBtn=$('[data-del]',m.box);
  if(delBtn)delBtn.addEventListener('click',async()=>{
    if(!await confirmDlg({msg:'Tem a certeza de que pretende eliminar este registo? Esta ação não pode ser revertida.'}))return;
    setBusy(delBtn,true);
    try{
      await dbDel(ent,row[ent.pk]);
      toast('Registo eliminado.');
      m.close();
      if(o.onSaved)o.onSaved(null);
    }catch(e){
      toast(errMsg(e),'error');
      setBusy(delBtn,false);
    }
  });
}

const ACT={
  noop(){},
  settings(){openSettings()},
  logout(){logout()},
  sort(el){
    const c=LISTS[el.dataset.key];
    if(!c)return;
    const k=el.dataset.k;
    const colDef=c.ent.cols.find(x=>x.k===k);
    if(c.st.sortK===k)c.st.sortDir=c.st.sortDir==='asc'?'desc':'asc';
    else{c.st.sortK=k;c.st.sortDir=colDef&&(colDef.f==='date'||colDef.f==='money')?'desc':'asc'}
    c.st.page=1;
    loadList(c);
  },
  page(el){
    const c=LISTS[el.dataset.key];
    if(!c)return;
    c.st.page=Number(el.dataset.p);
    loadList(c);
  },
  'list-new'(el){
    const c=LISTS[el.dataset.key];
    if(c.onNew)return c.onNew();
    openForm(c.ent,null,{defaults:c.defaults,onSaved:()=>c.reload()});
  },
  'list-open'(el){
    const c=LISTS[el.dataset.key];
    const row=c.st.rows.find(r=>String(r[c.ent.pk])===el.dataset.id);
    if(!row)return;
    if(c.onOpen)return c.onOpen(row);
    openForm(c.ent,row,{onSaved:()=>c.reload()});
  },
  'row-edit'(el){ACT['list-open'](el)},
  async 'row-del'(el){
    const c=LISTS[el.dataset.key];
    if(!await confirmDlg({msg:'Eliminar este registo? Esta ação não pode ser revertida.'}))return;
    try{
      await dbDel(c.ent,el.dataset.id);
      toast('Registo eliminado.');
      c.reload();
    }catch(e){toast(errMsg(e),'error')}
  },
  'panel-close'(){closePanel()},
  'g-tab'(el){
    GD.tab=el.dataset.tab;
    renderPanelTabs();
    renderPanelBody();
  },
  'g-sub'(el){
    GD.sub[el.dataset.kind]=el.dataset.sub;
    renderLines(el.dataset.kind);
  },
  'g-save'(el){saveGrupo(el)},
  'g-del'(){deleteGrupo()},
  'ln-new'(el){openLine(el.dataset.ek,null,false)},
  'ln-edit'(el){
    const row=(GD.rows[el.dataset.ek]||[]).find(r=>String(r[ENT[el.dataset.ek].pk])===el.dataset.id);
    if(row)openLine(el.dataset.ek,row,false);
  },
  'ln-dup'(el){
    const row=(GD.rows[el.dataset.ek]||[]).find(r=>String(r[ENT[el.dataset.ek].pk])===el.dataset.id);
    if(row)openLine(el.dataset.ek,row,true);
  },
  async 'ln-del'(el){
    const ek=el.dataset.ek;
    if(!await confirmDlg({msg:'Eliminar esta linha? Esta ação não pode ser revertida.'}))return;
    try{
      await dbDel(ENT[ek],el.dataset.id);
      toast('Linha eliminada.');
      afterLine(ek);
    }catch(e){toast(errMsg(e),'error')}
  }
};

async function onToggle(el){
  const c=LISTS[el.dataset.key];
  if(!c)return;
  const row=c.st.rows.find(r=>String(r[c.ent.pk])===el.dataset.id);
  const val=el.checked;
  const k=el.dataset.k;
  el.disabled=true;
  try{
    const r=await sb.from(c.ent.table).update({[k]:val}).eq(c.ent.pk,el.dataset.id).select();
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error('A operação não teve efeito. Verifique as permissões (RLS) da tabela.');
    if(row)row[k]=val;
    afterWrite(c.ent);
    toast(val?'Ativado.':'Desativado.');
  }catch(e){
    el.checked=!val;
    toast(errMsg(e),'error');
  }
  el.disabled=false;
}

  mountList($('#view'),{
    key:s[2],ent,st,
    title:fixas?'Despesas Fixas':'Despesas — Pagamentos',
    sub:fixas?'Custos recorrentes da empresa':'Registo de pagamentos e despesas',
    ph:'Pesquisar por empresa, tipo, notas…',
    createLabel:fixas?'Nova Despesa Fixa':'Nova Despesa',
    kpis:fixas
      ?[{l:'Registos',f:'int'},{l:'Custo mensal',col:'custo_mensal',f:'money'},{l:'Custo mensal c/ IVA',col:'custo_mensal_c_iva',f:'money'},{l:'IVA retido mensal',col:'iva_retido_mensal',f:'money'}]
      :[{l:'Registos',f:'int'},{l:'Total de despesas',col:'valor',f:'money',cls:'err'},{l:'Montante líquido',col:'montante_liquido',f:'money'},{l:'IVA dedutível',col:'iva_dedutivel',f:'money'}]
  });
}

function openSettings(first){
  const c=cfg();
  const m=openModal(
    '<div class="modal-h"><h3>Definições de ligação</h3>'+(first&&!c.url?'':'<button class="ib" data-close>'+ico('x')+'</button>')+'</div>'+
    '<div class="modal-b"><div class="setg">'+
    '<div class="fld"><label class="lbl">URL do Supabase</label><input class="inp" id="s-url" type="url" placeholder="https://xxxx.supabase.co" value="'+esc(c.url)+'" autocomplete="off"></div>'+
    '<div class="fld"><label class="lbl">Chave anónima (anon key)</label><input class="inp" id="s-key" type="password" placeholder="eyJ…" value="'+esc(c.key)+'" autocomplete="off"></div>'+
    '<label class="chk"><input type="checkbox" id="s-calc"'+(lsGet('ag_send_calc')==='1'?' checked':'')+'> Enviar totais calculados ao guardar (desativar se forem colunas geradas na base de dados)</label>'+
    '<details class="adv"><summary>Avançado: nomes de tabelas alternativos</summary><div class="fld"><textarea class="inp" id="s-tables" rows="4" placeholder=\'{"produtos_atividades":"atividades"}\'>'+esc(Object.keys(TB_OVERRIDE).length?JSON.stringify(TB_OVERRIDE,null,2):'')+'</textarea><span class="hint" style="margin-top:4px">Objeto JSON com o nome predefinido da tabela como chave e o nome real como valor.</span></div></details>'+
    '<p class="hint" style="margin:0">Os dados ficam guardados apenas neste navegador (localStorage).</p>'+
    '</div></div>'+
    '<div class="modal-f">'+(c.url?'<button class="btn btn-d mr-auto" data-clear>Limpar</button>':'')+(first&&!c.url?'':'<button class="btn btn-g" data-close>Cancelar</button>')+'<button class="btn btn-p" data-ok>Guardar e testar</button></div>',
    {cls:'sm',sticky:true}
  );
  m.box.style.marginTop='8vh';
  m.box.style.maxWidth='520px';
  const ok=$('[data-ok]',m.box);
  ok.addEventListener('click',async()=>{
    const url=$('#s-url').value.trim().replace(/\/+$/,'');
    const key=$('#s-key').value.trim();
    if(!/^https?:\/\/.+\..+/i.test(url)||!key){toast('Indique um URL válido e a chave anónima.','error');return}
    const tablesRaw=$('#s-tables').value.trim();
    let tablesStr='';
    if(tablesRaw){
      try{
        const o=JSON.parse(tablesRaw);
        if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('x');
        tablesStr=JSON.stringify(o);
      }catch(e){toast('O JSON dos nomes de tabelas é inválido.','error');return}
    }
    setBusy(ok,true);
    lsSet('ag_sb_url',url);
    lsSet('ag_sb_key',key);
    lsSet('ag_send_calc',$('#s-calc').checked?'1':'0');
    const prevTables=lsGet('ag_tables')||'';
    if(tablesStr!==prevTables){
      if(tablesStr)lsSet('ag_tables',tablesStr);else lsDel('ag_tables');
      location.reload();
      return;
    }
    sb=null;_sbUrl='';_sbKey='';
    initClient();
    const res=await checkConn();
    setBusy(ok,false);
    if(res.ok){toast('Ligação estabelecida com sucesso.');m.close();CACHE.sg={};CACHE.parc=null;CACHE.cat={};route()}
    else toast(res.msg||'Não foi possível ligar. Verifique o URL, a chave e as permissões.','error');
  });
  const clr=$('[data-clear]',m.box);
  if(clr)clr.addEventListener('click',async()=>{
    if(!await confirmDlg({title:'Limpar ligação',msg:'Remover o URL e a chave guardados neste navegador?',ok:'Limpar'}))return;
    lsDel('ag_sb_url');lsDel('ag_sb_key');
    sb=null;
    m.close();
    setConn('off');
    route();
  });
}

async function startApp(){
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  $$('[data-ic]').forEach(e=>{e.innerHTML=ico(e.dataset.ic)});
  initClient();
  route();
  if(!sb){setConn('off');openSettings(true);return}
  await checkConn();
}

gateInit();
if(ssGet('ag_auth_ok')==='1')startApp();
</script>
</body>
</html>
